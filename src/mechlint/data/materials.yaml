# Densities of the materials a printed robot is made of, kg/m^3.
#
# Every entry carries where the number came from. Printed parts are never solid,
# so the shell mass is density * volume * infill_factor, and the infill factor
# is per link in mechlint.yaml -- it is a slicer setting, not a material property.
#
# Extend this with your own YAML rather than editing this file.

materials:
  pla:
    name: PLA
    density_kg_m3: 1240
    source: "Filament datasheet consensus; 1.24 g/cm3 is the standard figure."
    confidence: high
  petg:
    name: PETG
    density_kg_m3: 1270
    source: "Filament datasheet consensus; 1.27 g/cm3."
    confidence: high
  abs:
    name: ABS
    density_kg_m3: 1040
    source: "Filament datasheet consensus; 1.04 g/cm3."
    confidence: high
  aluminium_6061:
    name: "Aluminium 6061-T6"
    density_kg_m3: 2700
    source: "Standard wrought aluminium alloy density."
    confidence: high
  steel_mild:
    name: "Mild steel"
    density_kg_m3: 7850
    source: "Standard structural steel density."
    confidence: high
