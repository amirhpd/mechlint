[project]
name = "mechlint"
version = "0.0.1"
description = "Lint and CI for robot mechanics: mass, inertia and joint torque from CAD + URDF, checked against actuator limits."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Amir" }]
keywords = ["robotics", "urdf", "ros2", "cad", "inertia", "torque", "mcp", "lint"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "trimesh>=4.0",
    "yourdfpy>=0.0.56",
    "xacro>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# STEP input: exact volume and hole/axis positions. Big wheels (OCP), hence optional.
step = ["build123d>=0.9"]
# Dynamic torques (RNEA) and self-collision. Roadmap, not v1.
dyn = ["pin>=3.0"]
# MCP server, so an LLM host can call the same functions.
mcp = ["mcp>=1.9"]

[project.scripts]
mechlint = "mechlint.cli.main:app"

[project.urls]
Homepage = "https://github.com/amirhpd/mechlint"
Repository = "https://github.com/amirhpd/mechlint"
Issues = "https://github.com/amirhpd/mechlint/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Caches live outside the repo. pytest and ruff each drop a directory with their own
# README and .gitignore inside it; keeping the working tree free of that is worth more
# than having them close by, and "~" is expanded so this stays portable.
cache_dir = "~/.cache/pytest/mechlint"
# Plugin autoload is off on purpose. Sourcing a ROS setup.bash puts /opt/ros on
# PYTHONPATH; its ament/launch_testing pytest plugins are then discovered from inside this
# venv and fail on imports they cannot satisfy here. mechlint uses no pytest plugins, so
# nothing is lost, and the suite runs identically in a ROS shell and outside one -- which
# is the whole ROS-free-core promise, and matters for mechlint_ros and colcon test later.
addopts = "-q --disable-plugin-autoload"

[tool.ruff]
cache-dir = "~/.cache/ruff/mechlint"  # see the note above
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
